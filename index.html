<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0a0f">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Achievements Investitore Retail | Futuristic</title>
    <link rel="stylesheet" href="styles.css?v=14.0">
    <style>
    /* Override forzato inline per mobile - MINIMO ASSOLUTO */
    @media screen and (max-width: 767px) {
        header {
            padding: 12px 16px !important;
            min-height: auto !important;
            max-height: 160px !important;
        }
        .header-top {
            margin-bottom: 8px !important;
            gap: 8px !important;
        }
        header h1 {
            font-size: 1.5em !important;
            margin-bottom: 4px !important;
            line-height: 1.2 !important;
            padding: 0 !important;
        }
        .stats {
            display: flex !important;
            flex-direction: row !important;
            gap: 8px !important;
            justify-content: space-between !important;
            align-items: center !important;
            margin: 8px 0 !important;
            padding: 0 !important;
            width: 100% !important;
            min-height: 80px !important;
            max-height: 90px !important;
            height: auto !important;
        }
        .stat {
            flex: 1 1 0% !important;
            padding: 8px 12px !important;
            text-align: center !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            margin: 0 !important;
            min-width: 0 !important;
            max-width: none !important;
            min-height: 76px !important;
            max-height: 84px !important;
            height: auto !important;
            border-radius: 12px !important;
            border-width: 1px !important;
        }
        .stat-value {
            font-size: 1.5em !important;
            margin-bottom: 4px !important;
            line-height: 1.2 !important;
            padding: 0 !important;
            font-weight: 600 !important;
            display: block !important;
        }
        .stat-label {
            font-size: 1.1em !important;
            margin-top: 0 !important;
            line-height: 1.2 !important;
            padding: 0 !important;
            font-weight: 500 !important;
            display: block !important;
        }
        .header-top {
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: center !important;
        }
        .header-actions {
            margin-left: auto !important;
            flex-direction: row !important;
            gap: 6px !important;
            display: flex !important;
            align-items: center !important;
        }
    }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <div class="login-header">
                <h1>🔐 Accesso Sicuro</h1>
                <p>Gestisci i tuoi achievement in sicurezza</p>
            </div>
            <div class="login-tabs">
                <button class="login-tab active" data-tab="login">Accedi</button>
                <button class="login-tab" data-tab="register">Registrati</button>
            </div>
            
            <!-- Form Login -->
            <form class="login-form active" id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">Nome Utente</label>
                    <input type="text" id="loginUsername" placeholder="Inserisci il tuo nome utente" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Inserisci la tua password" required autocomplete="current-password">
                    <button type="button" class="toggle-password" data-target="loginPassword">👁️</button>
                </div>
                <button type="submit" class="btn-login">Accedi</button>
                <div class="login-error" id="loginError"></div>
            </form>
            
            <!-- Form Registrazione -->
            <form class="login-form" id="registerForm">
                <div class="form-group">
                    <label for="registerUsername">Nome Utente</label>
                    <input type="text" id="registerUsername" placeholder="Scegli un nome utente" required autocomplete="username" minlength="3" maxlength="20">
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" placeholder="Scegli una password sicura" required autocomplete="new-password" minlength="6">
                    <button type="button" class="toggle-password" data-target="registerPassword">👁️</button>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Conferma Password</label>
                    <input type="password" id="confirmPassword" placeholder="Conferma la password" required autocomplete="new-password" minlength="6">
                    <button type="button" class="toggle-password" data-target="confirmPassword">👁️</button>
                </div>
                <button type="submit" class="btn-login">Registrati</button>
                <div class="login-error" id="registerError"></div>
            </form>
        </div>
    </div>

    <div class="container" id="mainContainer" style="display: none;">
        <header>
            <div class="header-top">
                <h1>Achievement per Investitori Retail</h1>
                <div class="header-actions">
                    <button class="user-selector-btn" id="userSelectorBtn" title="Gestisci utenti">
                        <span id="currentUserName">Utente</span>
                        <span class="user-icon">👤</span>
                    </button>
                    <button class="logout-btn" id="logoutBtn" title="Esci">
                        🚪
                    </button>
                </div>
            </div>
            <div class="stats">
                <div class="stat">
                    <span class="stat-value" id="completed">0</span>
                    <span class="stat-label">Completati</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="total">50</span>
                    <span class="stat-label">Totali</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="percentage">0%</span>
                    <span class="stat-label">Progresso</span>
                </div>
            </div>
        </header>

        <!-- Modal Gestione Utenti -->
        <div class="modal-overlay" id="userModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>👤 Il Tuo Profilo</h2>
                    <button class="modal-close" id="closeModal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="user-info-section">
                        <p class="info-text">🔒 Puoi vedere solo i tuoi achievement personali</p>
                        <p class="info-subtext">I tuoi dati sono privati e visibili solo a te</p>
                    </div>
                    <div class="users-list" id="usersList">
                        <!-- Lista utente corrente verrà generata dinamicamente -->
                    </div>
                </div>
            </div>
        </div>

        <div class="categories">
            <button class="category-btn active" data-category="all">Tutti</button>
            <button class="category-btn" data-category="guadagni">Guadagni</button>
            <button class="category-btn" data-category="performance">Performance</button>
            <button class="category-btn" data-category="dividendi">Dividendi</button>
            <button class="category-btn" data-category="milestone">Milestone</button>
            <button class="category-btn" data-category="strategia">Strategia</button>
        </div>

        <div class="achievements-grid" id="achievementsGrid">
            <!-- Achievement verranno generati dinamicamente -->
        </div>
    </div>

    <script src="achievements.js"></script>
    <script src="auth.js"></script>
    <script src="users.js"></script>
    <script src="app.js"></script>
    <script>
    // Forza layout compatto statistiche su mobile - ULTRA AGRESSIVO
    (function() {
        function applyCompactStats() {
            const stats = document.querySelector('.stats');
            if (stats && window.innerWidth <= 767) {
                // Usa cssText per sovrascrivere tutto
                stats.style.cssText = 'display: flex !important; flex-direction: row !important; gap: 8px !important; justify-content: space-between !important; align-items: center !important; margin: 8px 0 !important; padding: 0 !important; width: 100% !important; min-height: 80px !important; max-height: 90px !important; height: auto !important;';
                
                const statElements = document.querySelectorAll('.stat');
                statElements.forEach(stat => {
                    stat.style.cssText = 'flex: 1 1 0% !important; padding: 8px 12px !important; text-align: center !important; display: flex !important; flex-direction: column !important; justify-content: center !important; align-items: center !important; margin: 0 !important; min-width: 0 !important; min-height: 76px !important; max-height: 84px !important; border-radius: 12px !important;';
                });
                
                const statValues = document.querySelectorAll('.stat-value');
                statValues.forEach(value => {
                    value.style.cssText = 'font-size: 1.5em !important; margin-bottom: 4px !important; line-height: 1.2 !important; padding: 0 !important; font-weight: 600 !important; display: block !important;';
                });
                
                const statLabels = document.querySelectorAll('.stat-label');
                statLabels.forEach(label => {
                    label.style.cssText = 'font-size: 1.1em !important; margin-top: 0 !important; line-height: 1.2 !important; padding: 0 !important; font-weight: 500 !important; display: block !important;';
                });
                
                // Riduci anche header
                const header = document.querySelector('header');
                if (header) {
                    header.style.cssText += 'padding: 12px 16px !important; min-height: auto !important; max-height: 160px !important;';
                }
                
                const headerH1 = document.querySelector('header h1');
                if (headerH1) {
                    headerH1.style.cssText += 'font-size: 1.5em !important; margin-bottom: 4px !important; line-height: 1.2 !important;';
                }
                
                // Forza header-actions a destra
                const headerActions = document.querySelector('.header-actions');
                if (headerActions) {
                    headerActions.style.cssText += 'margin-left: auto !important; flex-direction: row !important; gap: 6px !important; display: flex !important; align-items: center !important;';
                }
                
                const headerTop = document.querySelector('.header-top');
                if (headerTop) {
                    headerTop.style.cssText += 'flex-direction: row !important; justify-content: space-between !important; align-items: center !important;';
                }
            }
        }
        
        // Applica immediatamente
        applyCompactStats();
        
        // Applica al caricamento
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyCompactStats);
        } else {
            applyCompactStats();
        }
        
        // Applica al resize
        window.addEventListener('resize', applyCompactStats);
        
        // Applica multipli delay per sicurezza
        setTimeout(applyCompactStats, 50);
        setTimeout(applyCompactStats, 100);
        setTimeout(applyCompactStats, 200);
        setTimeout(applyCompactStats, 500);
        setTimeout(applyCompactStats, 1000);
        
        // Observer per cambiamenti DOM
        if (typeof MutationObserver !== 'undefined') {
            const observer = new MutationObserver(applyCompactStats);
            observer.observe(document.body, { childList: true, subtree: true });
        }
    })();
    </script>
</body>
</html>
