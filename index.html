<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0a0f">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Achievements Investitore Retail | Futuristic</title>
    <link rel="stylesheet" href="styles.css?v=9.0">
    <style>
    /* Override forzato inline per mobile - ULTRA COMPATTO */
    @media screen and (max-width: 767px) {
        header {
            padding: 2px 4px !important;
            min-height: auto !important;
        }
        .header-top {
            margin-bottom: 2px !important;
            gap: 2px !important;
        }
        header h1 {
            font-size: 0.7em !important;
            margin-bottom: 2px !important;
            line-height: 1 !important;
        }
        .stats {
            display: flex !important;
            flex-direction: row !important;
            gap: 2px !important;
            justify-content: space-between !important;
            align-items: stretch !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            min-height: auto !important;
            height: auto !important;
        }
        .stat {
            flex: 1 1 0% !important;
            padding: 2px 3px !important;
            text-align: center !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            margin: 0 !important;
            min-width: 0 !important;
            max-width: none !important;
            min-height: auto !important;
            height: auto !important;
            border-radius: 4px !important;
        }
        .stat-value {
            font-size: 0.6em !important;
            margin-bottom: 0 !important;
            line-height: 0.9 !important;
            padding: 0 !important;
            font-weight: 600 !important;
        }
        .stat-label {
            font-size: 0.45em !important;
            margin-top: 0 !important;
            line-height: 0.9 !important;
            padding: 0 !important;
            font-weight: 500 !important;
        }
    }
    /* Specifico per smartphone piccoli */
    @media screen and (max-width: 430px) {
        header {
            padding: 2px 3px !important;
        }
        header h1 {
            font-size: 0.65em !important;
        }
        .stats {
            gap: 1px !important;
            margin-top: 1px !important;
            margin-bottom: 1px !important;
        }
        .stat {
            padding: 1px 2px !important;
        }
        .stat-value {
            font-size: 0.55em !important;
        }
        .stat-label {
            font-size: 0.4em !important;
        }
    }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <div class="login-header">
                <h1>🔐 Accesso Sicuro</h1>
                <p>Gestisci i tuoi achievement in sicurezza</p>
            </div>
            <div class="login-tabs">
                <button class="login-tab active" data-tab="login">Accedi</button>
                <button class="login-tab" data-tab="register">Registrati</button>
            </div>
            
            <!-- Form Login -->
            <form class="login-form active" id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">Nome Utente</label>
                    <input type="text" id="loginUsername" placeholder="Inserisci il tuo nome utente" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Inserisci la tua password" required autocomplete="current-password">
                    <button type="button" class="toggle-password" data-target="loginPassword">👁️</button>
                </div>
                <button type="submit" class="btn-login">Accedi</button>
                <div class="login-error" id="loginError"></div>
            </form>
            
            <!-- Form Registrazione -->
            <form class="login-form" id="registerForm">
                <div class="form-group">
                    <label for="registerUsername">Nome Utente</label>
                    <input type="text" id="registerUsername" placeholder="Scegli un nome utente" required autocomplete="username" minlength="3" maxlength="20">
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" placeholder="Scegli una password sicura" required autocomplete="new-password" minlength="6">
                    <button type="button" class="toggle-password" data-target="registerPassword">👁️</button>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Conferma Password</label>
                    <input type="password" id="confirmPassword" placeholder="Conferma la password" required autocomplete="new-password" minlength="6">
                    <button type="button" class="toggle-password" data-target="confirmPassword">👁️</button>
                </div>
                <button type="submit" class="btn-login">Registrati</button>
                <div class="login-error" id="registerError"></div>
            </form>
        </div>
    </div>

    <div class="container" id="mainContainer" style="display: none;">
        <header>
            <div class="header-top">
                <h1>50 Achievement per Investitori Retail</h1>
                <div class="header-actions">
                    <button class="user-selector-btn" id="userSelectorBtn" title="Gestisci utenti">
                        <span id="currentUserName">Utente</span>
                        <span class="user-icon">👤</span>
                    </button>
                    <button class="logout-btn" id="logoutBtn" title="Esci">
                        🚪
                    </button>
                </div>
            </div>
            <div class="stats">
                <div class="stat">
                    <span class="stat-value" id="completed">0</span>
                    <span class="stat-label">Completati</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="total">50</span>
                    <span class="stat-label">Totali</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="percentage">0%</span>
                    <span class="stat-label">Progresso</span>
                </div>
            </div>
        </header>

        <!-- Modal Gestione Utenti -->
        <div class="modal-overlay" id="userModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>👤 Il Tuo Profilo</h2>
                    <button class="modal-close" id="closeModal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="user-info-section">
                        <p class="info-text">🔒 Puoi vedere solo i tuoi achievement personali</p>
                        <p class="info-subtext">I tuoi dati sono privati e visibili solo a te</p>
                    </div>
                    <div class="users-list" id="usersList">
                        <!-- Lista utente corrente verrà generata dinamicamente -->
                    </div>
                </div>
            </div>
        </div>

        <div class="categories">
            <button class="category-btn active" data-category="all">Tutti</button>
            <button class="category-btn" data-category="guadagni">Guadagni</button>
            <button class="category-btn" data-category="performance">Performance</button>
            <button class="category-btn" data-category="dividendi">Dividendi</button>
            <button class="category-btn" data-category="milestone">Milestone</button>
            <button class="category-btn" data-category="strategia">Strategia</button>
        </div>

        <div class="achievements-grid" id="achievementsGrid">
            <!-- Achievement verranno generati dinamicamente -->
        </div>
    </div>

    <script src="achievements.js"></script>
    <script src="auth.js"></script>
    <script src="users.js"></script>
    <script src="app.js"></script>
    <script>
    // Forza layout compatto statistiche su mobile
    (function() {
        function applyCompactStats() {
            const stats = document.querySelector('.stats');
            if (stats && window.innerWidth <= 430) {
                stats.style.display = 'flex';
                stats.style.flexDirection = 'row';
                stats.style.gap = '3px';
                stats.style.justifyContent = 'space-between';
                stats.style.alignItems = 'stretch';
                stats.style.margin = '0';
                stats.style.padding = '0';
                
                const statElements = document.querySelectorAll('.stat');
                statElements.forEach(stat => {
                    stat.style.flex = '1';
                    stat.style.padding = '2px 3px';
                    stat.style.minHeight = 'auto';
                    stat.style.height = 'auto';
                    stat.style.textAlign = 'center';
                    stat.style.display = 'flex';
                    stat.style.flexDirection = 'column';
                    stat.style.justifyContent = 'center';
                    stat.style.alignItems = 'center';
                });
                
                const statValues = document.querySelectorAll('.stat-value');
                statValues.forEach(value => {
                    value.style.fontSize = '0.6em';
                    value.style.lineHeight = '1';
                    value.style.marginBottom = '0';
                });
                
                const statLabels = document.querySelectorAll('.stat-label');
                statLabels.forEach(label => {
                    label.style.fontSize = '0.45em';
                    label.style.lineHeight = '1';
                    label.style.marginTop = '0';
                });
            }
        }
        
        // Applica al caricamento
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyCompactStats);
        } else {
            applyCompactStats();
        }
        
        // Applica al resize
        window.addEventListener('resize', applyCompactStats);
        
        // Applica dopo un breve delay per sicurezza
        setTimeout(applyCompactStats, 100);
        setTimeout(applyCompactStats, 500);
    })();
    </script>
</body>
</html>
